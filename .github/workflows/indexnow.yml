name: Submit URLs to IndexNow (Bing)

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/posts/**'   # only trigger when posts are added/changed

jobs:
  indexnow:
    name: IndexNow Submission
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for Cloudflare Pages to deploy
        run: sleep 120   # 2-minute wait for CF to finish deploying

      - name: Submit all post URLs to IndexNow
        run: node scripts/indexnow-submit.js
